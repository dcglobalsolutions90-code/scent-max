<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nav3D">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
<title>Nav3D GPS</title>
<style>
:root{--bg:#07111a;--panel:#0b1d29;--panel2:#102839;--line:#1d4054;--text:#edf7fb;--muted:#91a9b7;--accent:#63dcff;--green:#55d98d;--yellow:#ffd166;--red:#ff6868}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#app{position:relative;width:100%;height:100%}
#map{position:absolute;inset:0;background:#07111a}
.top{position:absolute;z-index:30;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center}
.brand{height:46px;min-width:46px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(5,17,26,.88);backdrop-filter:blur(14px);display:grid;place-items:center;font-weight:950;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.brand span{color:var(--accent)}
.searchWrap{flex:1;min-width:0;display:flex;background:rgba(5,17,26,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13);border-radius:15px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.searchWrap input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:white;font-size:16px;padding:0 12px;height:46px}
.searchWrap button{width:52px;border:0;border-left:1px solid rgba(255,255,255,.1);background:transparent;color:white;font-size:18px}
.results{position:absolute;z-index:35;top:64px;left:64px;right:10px;background:rgba(6,20,30,.97);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:none;max-height:45%;overflow-y:auto}
.result{width:100%;text-align:left;border:0;border-bottom:1px solid #17384a;background:transparent;color:white;padding:12px 13px;font-size:13px;line-height:1.35}
.result:last-child{border-bottom:0}.result small{display:block;color:var(--muted);margin-top:3px}
.controls{position:absolute;z-index:25;right:10px;top:76px;display:flex;flex-direction:column;gap:8px}
.fab{width:48px;height:48px;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(5,17,26,.9);backdrop-filter:blur(12px);color:white;font-size:20px;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.fab.active{background:#12394e;color:var(--accent);border-color:#2d708c}
.routeCard{position:absolute;z-index:30;left:10px;right:10px;bottom:10px;background:rgba(6,20,30,.94);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:19px;padding:13px;box-shadow:0 14px 40px rgba(0,0,0,.3);display:none}
.routeTop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.routePlace{font-size:14px;font-weight:900;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{border:0;background:#102b3b;color:#a9bfcc;border-radius:10px;width:34px;height:34px;font-size:18px}
.tripStats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.stat{background:#0e2736;border-radius:11px;padding:9px}.stat span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em}.stat b{font-size:15px}
.start{margin-top:10px;width:100%;height:48px;border:0;border-radius:13px;background:var(--accent);color:#05121a;font-weight:950;font-size:15px}
.start.stop{background:var(--red);color:white}
.navBanner{position:absolute;z-index:40;top:72px;left:10px;right:68px;background:rgba(6,20,30,.96);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:17px;padding:12px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.26)}
.navRow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}.turnIcon{width:52px;height:52px;border-radius:14px;background:#0e2c3e;display:grid;place-items:center;font-size:30px}.turnMain b{display:block;font-size:18px;line-height:1.1}.turnMain span{color:var(--muted);font-size:12px}.navMeta{display:flex;gap:14px;margin-top:8px;font-size:11px;color:#a8bdc8}
.status{position:absolute;z-index:25;left:10px;bottom:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(5,17,26,.88);backdrop-filter:blur(12px);font-size:11px;color:#b0c2cc;display:none}
.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-bottom-left{display:none}
.carMarker{width:30px;height:30px;border-radius:50%;background:#07111a;border:4px solid white;box-shadow:0 0 0 4px rgba(99,220,255,.25),0 4px 12px rgba(0,0,0,.4);position:relative}
.carMarker:after{content:"";position:absolute;left:50%;top:-13px;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid white}
.destMarker{width:24px;height:24px;border-radius:50% 50% 50% 0;background:#ff5f6d;transform:rotate(-45deg);border:3px solid white;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.destMarker:after{content:"";width:6px;height:6px;border-radius:50%;background:white;position:absolute;left:6px;top:6px}
.loading{position:absolute;z-index:50;inset:0;display:none;place-items:center;background:rgba(4,14,22,.6);backdrop-filter:blur(4px)}.loading div{padding:13px 16px;background:#0b1d29;border:1px solid var(--line);border-radius:14px;font-weight:800}
.info{position:absolute;z-index:20;left:10px;top:76px;right:68px;background:rgba(6,20,30,.9);border:1px solid var(--line);border-radius:15px;padding:10px 12px;font-size:12px;color:var(--muted);backdrop-filter:blur(12px)}
.info b{color:white}
@media(min-width:760px){.top,.routeCard{max-width:620px;left:50%;right:auto;width:calc(100% - 24px);transform:translateX(-50%)}.results{left:50%;right:auto;width:min(556px,calc(100% - 88px));transform:translateX(calc(-50% + 32px))}.navBanner{max-width:552px;left:50%;right:auto;width:calc(100% - 88px);transform:translateX(calc(-50% - 28px))}}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="top">
    <div class="brand">N<span>3D</span></div>
    <form id="searchForm" class="searchWrap">
      <input id="searchInput" autocomplete="street-address" placeholder="Where do you want to go?" aria-label="Destination">
      <button type="submit" aria-label="Search">⌕</button>
    </form>
  </div>
  <div id="results" class="results"></div>
  <div class="controls">
    <button id="locateBtn" class="fab" type="button" aria-label="My location">◎</button>
    <button id="tiltBtn" class="fab active" type="button" aria-label="Toggle 3D">3D</button>
    <button id="northBtn" class="fab" type="button" aria-label="Face north">↑</button>
  </div>
  <div id="info" class="info"><b>Tap ◎ to use your location.</b> Then search a destination. Routes use OpenStreetMap data; this prototype does not include live traffic.</div>
  <div id="navBanner" class="navBanner">
    <div class="navRow">
      <div id="turnIcon" class="turnIcon">↑</div>
      <div class="turnMain"><b id="nextDistance">—</b><span id="nextInstruction">Continue on route</span></div>
    </div>
    <div class="navMeta"><span id="navEta">ETA —</span><span id="navRemaining">— remaining</span><span id="gpsAccuracy">GPS —</span></div>
  </div>
  <div id="routeCard" class="routeCard">
    <div class="routeTop"><div id="routePlace" class="routePlace">Destination</div><button id="closeRoute" class="close" type="button">×</button></div>
    <div class="tripStats">
      <div class="stat"><span>ETA</span><b id="eta">—</b></div>
      <div class="stat"><span>Time</span><b id="duration">—</b></div>
      <div class="stat"><span>Distance</span><b id="distance">—</b></div>
    </div>
    <button id="startBtn" class="start" type="button">Start navigation</button>
  </div>
  <div id="status" class="status"></div>
  <div id="loading" class="loading"><div id="loadingText">Loading…</div></div>
</div>

<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs';

const STYLE='https://tiles.openfreemap.org/styles/liberty';
const PHOTON='https://photon.komoot.io/api/';
const OSRM='https://router.project-osrm.org/route/v1/driving/';
const state={current:null,last:null,dest:null,destName:'',route:null,steps:[],stepIndex:0,navigating:false,watchId:null,userMarker:null,destMarker:null,lastReroute:0,voice:true,follow:true};
const $=id=>document.getElementById(id);
const showStatus=(msg,ms=3000)=>{$('status').textContent=msg;$('status').style.display='block';clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>{$('status').style.display='none'},ms)};
const busy=(on,msg='Loading…')=>{$('loadingText').textContent=msg;$('loading').style.display=on?'grid':'none'};
const map=new maplibregl.Map({container:'map',style:STYLE,center:[-79,36],zoom:6,pitch:58,bearing:0,antialias:true});
map.addControl(new maplibregl.NavigationControl({showCompass:false,showZoom:false}));
map.on('load',()=>{
  add3DBuildings();
  map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'route-outline',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#06111a','line-width':11,'line-opacity':.8}});
  map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#63dcff','line-width':7,'line-opacity':.95}});
});
function add3DBuildings(){
  try{
    const style=map.getStyle();
    const layer=style.layers.find(l=>l['source-layer']==='building');
    if(!layer)return;
    const firstSymbol=style.layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
    map.addLayer({
      id:'nav3d-buildings',type:'fill-extrusion',source:layer.source,'source-layer':'building',minzoom:14,
      paint:{
        'fill-extrusion-color':['interpolate',['linear'],['zoom'],14,'#738695',18,'#9eacb7'],
        'fill-extrusion-height':['coalesce',['to-number',['get','render_height']],['to-number',['get','height']],8],
        'fill-extrusion-base':['coalesce',['to-number',['get','render_min_height']],['to-number',['get','min_height']],0],
        'fill-extrusion-opacity':.72
      }
    },firstSymbol?firstSymbol.id:undefined);
  }catch(e){}
}
function hav(a,b){
  const R=6371000,p=Math.PI/180,dLat=(b[1]-a[1])*p,dLon=(b[0]-a[0])*p;
  const x=Math.sin(dLat/2)**2+Math.cos(a[1]*p)*Math.cos(b[1]*p)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function bearing(a,b){
  const p=Math.PI/180,y=Math.sin((b[0]-a[0])*p)*Math.cos(b[1]*p);
  const x=Math.cos(a[1]*p)*Math.sin(b[1]*p)-Math.sin(a[1]*p)*Math.cos(b[1]*p)*Math.cos((b[0]-a[0])*p);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function fmtDist(m){return m<1609?(m<300?Math.round(m/10)*10+' ft':(m*3.28084/100).toFixed(1)+'00 ft'):(m/1609.344).toFixed(m<16093?1:0)+' mi'}
function fmtTime(sec){const m=Math.round(sec/60);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' hr'+(r?' '+r+' min':'')}
function etaText(sec){return new Date(Date.now()+sec*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function placeLabel(f){const p=f.properties||{};return [p.name,p.street,p.city||p.locality,p.state].filter((x,i,a)=>x&&a.indexOf(x)===i).join(', ')||'Selected destination'}
function setUserMarker(coord,heading=0){
  if(!state.userMarker){const el=document.createElement('div');el.className='carMarker';state.userMarker=new maplibregl.Marker({element:el,rotationAlignment:'map'}).setLngLat(coord).addTo(map)}
  else state.userMarker.setLngLat(coord);
  state.userMarker.setRotation(heading||0);
}
function locateOnce(){
  if(!navigator.geolocation){showStatus('GPS is not supported on this device.');return}
  busy(true,'Getting your location…');
  navigator.geolocation.getCurrentPosition(p=>{
    busy(false);state.current=[p.coords.longitude,p.coords.latitude];state.last=state.current;setUserMarker(state.current,p.coords.heading||0);
    map.easeTo({center:state.current,zoom:17,pitch:62,bearing:p.coords.heading||0,duration:900});
    $('info').style.display='none';showStatus('Location ready · ±'+Math.round(p.coords.accuracy)+' m');
    if(state.dest)routeToDestination();
  },e=>{busy(false);showStatus('Location unavailable. Allow Location access in Safari.',5000)},{enableHighAccuracy:true,timeout:12000,maximumAge:5000});
}
async function searchDestination(q){
  if(!q.trim())return;
  busy(true,'Searching…');$('results').style.display='none';
  try{
    let url=PHOTON+'?limit=6&q='+encodeURIComponent(q.trim());
    if(state.current)url+='&lon='+state.current[0]+'&lat='+state.current[1];
    const r=await fetch(url);if(!r.ok)throw new Error();
    const j=await r.json();busy(false);
    renderResults(j.features||[]);
  }catch(e){busy(false);showStatus('Search service unavailable. Try again.',4000)}
}
function renderResults(list){
  const box=$('results');box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="result">No matching places found.</div>';box.style.display='block';return}
  list.forEach(f=>{
    const b=document.createElement('button');b.className='result';b.type='button';
    const label=placeLabel(f),p=f.properties||{};
    b.innerHTML='<strong>'+escapeHtml(label)+'</strong><small>'+escapeHtml([p.country,p.postcode].filter(Boolean).join(' · '))+'</small>';
    b.addEventListener('click',()=>selectDestination(f));box.appendChild(b);
  });box.style.display='block';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function selectDestination(f){
  $('results').style.display='none';
  const c=f.geometry.coordinates;state.dest=[c[0],c[1]];state.destName=placeLabel(f);
  if(state.destMarker)state.destMarker.remove();
  const el=document.createElement('div');el.className='destMarker';state.destMarker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat(state.dest).addTo(map);
  $('routePlace').textContent=state.destName;
  if(state.current)routeToDestination();else{map.easeTo({center:state.dest,zoom:15,pitch:55});$('routeCard').style.display='block';$('startBtn').disabled=true;$('startBtn').textContent='Tap ◎ to get your location'}
}
async function routeToDestination(silent=false){
  if(!state.current||!state.dest)return;
  if(!silent)busy(true,'Building route…');
  try{
    const url=OSRM+state.current[0]+','+state.current[1]+';'+state.dest[0]+','+state.dest[1]+'?overview=full&geometries=geojson&steps=true&alternatives=false';
    const r=await fetch(url);if(!r.ok)throw new Error();
    const j=await r.json();if(j.code!=='Ok'||!j.routes||!j.routes[0])throw new Error();
    const rt=j.routes[0];state.route=rt;state.steps=(rt.legs[0]&&rt.legs[0].steps)||[];state.stepIndex=0;
    const src=map.getSource('route');if(src)src.setData({type:'Feature',properties:{},geometry:rt.geometry});
    $('eta').textContent=etaText(rt.duration);$('duration').textContent=fmtTime(rt.duration);$('distance').textContent=fmtDist(rt.distance);$('routeCard').style.display='block';
    $('startBtn').disabled=false;$('startBtn').textContent=state.navigating?'Stop navigation':'Start navigation';$('startBtn').classList.toggle('stop',state.navigating);
    fitRoute(rt.geometry.coordinates);
    if(!silent)busy(false);
    if(state.navigating)updateNavigationUI();
  }catch(e){if(!silent)busy(false);showStatus('Could not build that route. Try another destination.',5000)}
}
function fitRoute(coords){
  if(!coords||coords.length<2)return;
  const b=new maplibregl.LngLatBounds(coords[0],coords[0]);coords.forEach(c=>b.extend(c));
  map.fitBounds(b,{padding:{top:120,bottom:190,left:50,right:50},maxZoom:16,pitch:48,duration:900});
}
function maneuverText(step){
  if(!step)return 'Continue on route';
  const m=step.maneuver||{},road=step.name?' onto '+step.name:'';
  if(m.type==='arrive')return 'Arrive at destination';
  if(m.type==='depart')return 'Head '+(m.modifier||'forward')+road;
  if(m.type==='roundabout'||m.type==='rotary')return 'Enter roundabout'+(m.exit?' · take exit '+m.exit:'')+road;
  if(m.type==='merge')return 'Merge '+(m.modifier||'')+road;
  if(m.type==='fork')return 'Keep '+(m.modifier||'')+road;
  if(m.type==='turn')return 'Turn '+(m.modifier||'')+road;
  if(m.type==='new name')return 'Continue'+road;
  if(m.type==='end of road')return 'At the end of the road, turn '+(m.modifier||'')+road;
  return (m.type?m.type.replace(/_/g,' '):'Continue')+road;
}
function arrowFor(step){
  const m=(step&&step.maneuver)||{},x=(m.modifier||'').toLowerCase();
  if(m.type==='arrive')return '●';if(m.type==='roundabout'||m.type==='rotary')return '↻';
  if(x.includes('left'))return x.includes('slight')?'↖':'←';
  if(x.includes('right'))return x.includes('slight')?'↗':'→';
  if(x.includes('uturn'))return '↩';return '↑';
}
function updateNavigationUI(pos){
  if(!state.navigating||!state.current||!state.route)return;
  let idx=state.stepIndex;
  while(idx<state.steps.length-1){
    const loc=state.steps[idx].maneuver&&state.steps[idx].maneuver.location;
    if(!loc)break;
    const d=hav(state.current,loc);
    if(d<35){idx++;state.stepIndex=idx;speak(maneuverText(state.steps[idx]));}else break;
  }
  const step=state.steps[state.stepIndex];
  const loc=step&&step.maneuver&&step.maneuver.location;
  const d=loc?hav(state.current,loc):0;
  $('turnIcon').textContent=arrowFor(step);$('nextDistance').textContent=step&&step.maneuver&&step.maneuver.type==='arrive'?'Arriving':fmtDist(d);$('nextInstruction').textContent=maneuverText(step);
  const rem=estimateRemaining();$('navRemaining').textContent=fmtDist(rem.distance)+' remaining';$('navEta').textContent='ETA '+etaText(rem.duration);
  if(pos&&pos.coords)$('gpsAccuracy').textContent='GPS ±'+Math.round(pos.coords.accuracy)+' m';
}
function estimateRemaining(){
  if(!state.route)return {distance:0,duration:0};
  const coords=state.route.geometry.coordinates;let nearest=0,best=Infinity;
  for(let i=0;i<coords.length;i+=Math.max(1,Math.floor(coords.length/600))){const d=hav(state.current,coords[i]);if(d<best){best=d;nearest=i}}
  let dist=0;for(let i=nearest;i<coords.length-1;i++)dist+=hav(coords[i],coords[i+1]);
  const speed=state.route.distance>0?state.route.duration/state.route.distance:0;return {distance:dist,duration:dist*speed}
}
function distanceFromRoute(){
  if(!state.route||!state.current)return 0;const c=state.route.geometry.coordinates;let best=Infinity;
  for(let i=0;i<c.length;i+=Math.max(1,Math.floor(c.length/700)))best=Math.min(best,hav(state.current,c[i]));return best
}
function startNavigation(){
  if(state.navigating){stopNavigation();return}
  if(!state.route||!state.current)return;
  state.navigating=true;$('startBtn').textContent='Stop navigation';$('startBtn').classList.add('stop');$('navBanner').style.display='block';$('routeCard').style.bottom='10px';
  speak('Navigation started. '+maneuverText(state.steps[0]));
  state.watchId=navigator.geolocation.watchPosition(onPosition,e=>showStatus('GPS signal interrupted.',3500),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}
function stopNavigation(){
  state.navigating=false;if(state.watchId!==null){navigator.geolocation.clearWatch(state.watchId);state.watchId=null}
  $('navBanner').style.display='none';$('startBtn').textContent='Start navigation';$('startBtn').classList.remove('stop');showStatus('Navigation stopped');
}
function onPosition(p){
  const cur=[p.coords.longitude,p.coords.latitude],prev=state.current||cur;state.last=prev;state.current=cur;
  let head=Number.isFinite(p.coords.heading)?p.coords.heading:(hav(prev,cur)>4?bearing(prev,cur):map.getBearing());
  setUserMarker(cur,head);
  if(state.follow)map.easeTo({center:cur,zoom:18.1,pitch:67,bearing:head,duration:700});
  updateNavigationUI(p);
  const off=distanceFromRoute();
  if(off>80&&Date.now()-state.lastReroute>15000){state.lastReroute=Date.now();showStatus('Rerouting…');routeToDestination(true)}
  if(state.dest&&hav(cur,state.dest)<35){speak('You have arrived at your destination.');showStatus('You have arrived.',6000);stopNavigation()}
}
function speak(text){if(!state.voice||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.02;speechSynthesis.speak(u)}catch(e){}}
function clearRoute(){
  stopNavigation();state.dest=null;state.route=null;state.steps=[];if(state.destMarker){state.destMarker.remove();state.destMarker=null}
  const src=map.getSource('route');if(src)src.setData({type:'FeatureCollection',features:[]});$('routeCard').style.display='none';$('searchInput').value='';$('results').style.display='none';
}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();searchDestination($('searchInput').value)});
$('locateBtn').addEventListener('click',locateOnce);
$('tiltBtn').addEventListener('click',()=>{const on=map.getPitch()>20;map.easeTo({pitch:on?0:62,duration:500});$('tiltBtn').classList.toggle('active',!on)});
$('northBtn').addEventListener('click',()=>map.easeTo({bearing:0,duration:450}));

name: Inspect ESPN odds fields

on:
  push:
    paths:
      - ".github/workflows/inspect-espn-odds.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect sample odds
        run: |
          python - <<'PY'
          import json, urllib.request
          urls=[
            'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=20261003&limit=100',
            'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=20261003&limit=200'
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as r:j=json.load(r)
            for e in j.get('events',[]):
              if 'Washington' in (e.get('name') or '') or 'Old Dominion' in (e.get('name') or ''):
                c=(e.get('competitions') or [{}])[0]
                print('EVENT',e.get('name'))
                print('ODDS',json.dumps(c.get('odds'),indent=2)[:5000])
                print('COMPETITORS',json.dumps(c.get('competitors'),indent=2)[:5000])
          PY

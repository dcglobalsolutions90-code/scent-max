name: Kalshi sports cloud paper bot
# Cloud scanner aligned with Nightlink 24-hour candidate pool
# Diagnostic run for entry-gate alignment
# Full 24-hour slate run

on:
  push:
    paths:
      - ".github/workflows/kalshi-sports-cloud-bot.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kalshi-sports-cloud-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6

      - name: Run persistent paper bot and save state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="kalshi-sports-bot-state"
          ASSET="kalshi-sports-state.json"
          STATE="/tmp/$ASSET"
          RESP="/tmp/kalshi-sports-response.json"
          ENDPOINT="https://nightlink-omega.vercel.app/api/kalshi-sports-bot"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern "$ASSET" --dir /tmp --clobber >/dev/null 2>&1 || true
          else
            gh release create "$TAG" --title "Kalshi Sports Paper Bot State" --notes "Persistent paper-only bot state. Updated automatically." >/dev/null
          fi

          if [ ! -s "$STATE" ]; then
            cat > "$STATE" <<'JSON'
          {"cash":500,"startEquity":500,"positions":[],"history":[],"traded":{},"auto":true}
          JSON
          fi

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            FRESH=$(python - <<'PY'
          import json,time,datetime
          try:
              st=json.load(open('/tmp/kalshi-sports-state.json'))
              raw=st.get('lastRun')
              if not raw:
                  print('0')
              else:
                  dt=datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
                  age=time.time()-dt.timestamp()
                  print('1' if age < 900 else '0')
          except Exception:
              print('0')
          PY
            )
            if [ "$FRESH" = "1" ]; then
              echo "healthy_chain_recent_run=1"
              exit 0
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Waiting 5 minutes before next cloud scan..."
            sleep 300
          fi

          OK=0
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o "$RESP" -w "%{http_code}" --max-time 58               -X POST               -H "Content-Type: application/json"               --data-binary @"$STATE"               "$ENDPOINT" || true)

            echo "attempt=$i http=$CODE"
            if [ "$CODE" = "200" ]; then
              python - <<'PY'
          import json
          p='/tmp/kalshi-sports-response.json'
          j=json.load(open(p))
          if not j.get('ok'):
              raise SystemExit(j.get('error','bot returned ok=false'))
          state=j.get('state') or {}
          with open('/tmp/kalshi-sports-state.json','w') as f:
              json.dump(state,f,separators=(',',':'))
          print('cash=',round(float(state.get('cash',0)),2))
          print('open_positions=',len(state.get('positions') or []))
          print('settled=',len(state.get('history') or []))
          print('last_run=',state.get('lastRun'))
          print('summary=',state.get('lastSummary'))
          PY
              OK=1
              break
            fi
            sleep 5
          done

          if [ "$OK" != "1" ]; then
            echo "Bot did not complete successfully"
            exit 1
          fi

          gh release upload "$TAG" "$STATE" --clobber >/dev/null
          echo "state_asset_updated=1"

          sleep 2
          curl -sS --max-time 20 "https://nightlink-omega.vercel.app/api/kalshi-sports-bot" -o /tmp/readback.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/readback.json'))
          if not j.get('ok') or not j.get('state'):
              raise SystemExit('Nightlink state read-back failed')
          st=j['state']
          print('dashboard_readback=OK')
          print('dashboard_last_run=',st.get('lastRun'))
          print('dashboard_open_positions=',len(st.get('positions') or []))
          PY

          echo "queueing_next_scan=1"
          gh workflow run kalshi-sports-cloud-bot.yml --ref main

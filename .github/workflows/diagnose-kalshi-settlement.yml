name: Diagnose Kalshi settled sports markets

on:
  push:
    paths:
      - ".github/workflows/diagnose-kalshi-settlement.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact Kalshi market settlement payloads
        run: |
          python - <<'PY'
          import json, urllib.request
          tickers=[
            'KXNCAAFGAME-26OCT03BGSUMOH-MOH',
            'KXNCAAFGAME-26OCT03ODUGAST-GAST',
            'KXNCAAFGAME-26OCT03MSUWIS-WIS'
          ]
          for t in tickers:
            url='https://external-api.kalshi.com/trade-api/v2/markets/'+t
            req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'})
            print('\nTICKER',t)
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                j=json.load(r)
              m=j.get('market',j)
              keys=['ticker','title','status','result','settlement_value','settlement_value_dollars','settlement_ts','close_time','expiration_time','yes_bid_dollars','yes_ask_dollars','last_price_dollars']
              print(json.dumps({k:m.get(k) for k in keys},indent=2))
            except Exception as e:
              print('ERROR',repr(e))
          PY

name: Backtest calibrated NCAAF model

on:
  push:
    paths:
      - ".github/workflows/backtest-ncaaf-v2.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run no-lookahead NCAAF walk-forward backtest
        run: |
          cat > /tmp/backtest.py <<'PY'
          import json, math, re, time, urllib.request, urllib.parse, datetime, statistics
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import defaultdict

          K='https://external-api.kalshi.com/trade-api/v2'
          E='https://site.api.espn.com/apis/site/v2/sports/football/college-football'
          UA={'Accept':'application/json','User-Agent':'Mozilla/5.0 NightlinkBacktest/2.1'}
          MONTH={m:i for i,m in enumerate(['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],1)}

          def get(url,timeout=30,retries=3):
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url,headers=UA)
                      with urllib.request.urlopen(req,timeout=timeout) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e; time.sleep(.35*(i+1))
              raise last

          def norm(s):
              s=(s or '').lower()
              repl={'st.':'state','saint':'state','miami (oh)':'miami ohio','miami (fl)':'miami florida',
                    'ole miss':'mississippi','uconn':'connecticut','utsa':'texas san antonio',
                    'utep':'texas el paso','ul monroe':'louisiana monroe','ulm':'louisiana monroe',
                    'app state':'appalachian state','nc state':'north carolina state'}
              for a,b in repl.items(): s=s.replace(a,b)
              return re.sub(r'[^a-z0-9]+',' ',s).strip()

          def toks(s):
              stop={'at','vs','the','university','college','football','wins','winner'}
              return [x for x in norm(s).split() if len(x)>1 and x not in stop]

          def sim(a,b):
              A=set(toks(a));B=set(toks(b))
              return len(A&B)/max(1,max(len(A),len(B)))

          def team_sim(label,competitor):
              team=(competitor or {}).get('team') or {}
              vals=[
                  team.get('displayName'),team.get('shortDisplayName'),team.get('location'),
                  team.get('name'),team.get('abbreviation')
              ]
              return max([sim(label,v) for v in vals if v] or [0])

          def score_value(c):
              s=(c or {}).get('score')
              if isinstance(s,dict):
                  s=s.get('value',s.get('displayValue'))
              try:return float(s)
              except:return None

          def parse_event_date(ticker):
              m=re.search(r'-(\d{2})(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)(\d{2})',ticker)
              if not m:return None
              return datetime.date(2000+int(m.group(1)),MONTH[m.group(2)],int(m.group(3)))

          def hist_markets():
              out=[];cursor=''
              for page in range(30):
                  q={'series_ticker':'KXNCAAFGAME','limit':1000}
                  if cursor:q['cursor']=cursor
                  u=K+'/historical/markets?'+urllib.parse.urlencode(q)
                  j=get(u)
                  arr=j.get('markets',[])
                  out.extend(arr)
                  # stop after we've paged well past 2025
                  years=[parse_event_date(m.get('event_ticker','')) for m in arr]
                  years=[d.year for d in years if d]
                  if years and max(years)<2025:break
                  cursor=j.get('cursor') or ''
                  if not cursor:break
              return out

          markets=hist_markets()
          by_event=defaultdict(list)
          for m in markets:
              d=parse_event_date(m.get('event_ticker',''))
              if not d or d.year!=2025:continue
              if str(m.get('result','')).lower() not in ('yes','no'):continue
              if not m.get('yes_sub_title'):continue
              by_event[m['event_ticker']].append(m)

          raw_events=[]
          for et,ms in by_event.items():
              # game winner event should expose both team contracts
              names={norm(m.get('yes_sub_title')) for m in ms if m.get('yes_sub_title')}
              if len(names)<2:continue
              d=parse_event_date(et)
              raw_events.append((d,et,ms))
          raw_events.sort(key=lambda x:x[0])

          # keep regular-season-heavy sample, chronological, to cap API work
          raw_events=[x for x in raw_events if datetime.date(2025,8,20)<=x[0]<=datetime.date(2025,12,6)]
          # evenly sample up to 800 unique games while preserving chronology
          if len(raw_events)>800:
              step=len(raw_events)/800
              raw_events=[raw_events[min(len(raw_events)-1,int(i*step))] for i in range(800)]

          print('historical_events_candidate=',len(raw_events))

          scoreboard_cache={}
          def scoreboard(d):
              key=d.strftime('%Y%m%d')
              if key not in scoreboard_cache:
                  u=E+'/scoreboard?dates='+key+'&limit=500'
                  scoreboard_cache[key]=get(u).get('events',[])
              return scoreboard_cache[key]

          matched=[]
          for d,et,ms in raw_events:
              teams=list(dict.fromkeys([m.get('yes_sub_title') for m in ms if m.get('yes_sub_title')]))
              if len(teams)<2:continue
              best=None
              for ev in scoreboard(d):
                  comp=(ev.get('competitions') or [{}])[0]
                  cs=comp.get('competitors') or []
                  if len(cs)<2:continue
                  a11=team_sim(teams[0],cs[0]);a12=team_sim(teams[0],cs[1])
                  a21=team_sim(teams[1],cs[0]);a22=team_sim(teams[1],cs[1])
                  score=max((a11+a22)/2,(a12+a21)/2)
                  if best is None or score>best[0]:best=(score,ev)
              if not best or best[0]<.45:continue
              ev=best[1];comp=(ev.get('competitions') or [{}])[0]
              cs=comp.get('competitors') or []
              if len(cs)<2:continue
              home=next((c for c in cs if c.get('homeAway')=='home'),cs[0])
              away=next((c for c in cs if c.get('homeAway')=='away'),cs[1])
              hs=score_value(home);as_=score_value(away)
              if hs is None or as_ is None:continue
              start=datetime.datetime.fromisoformat(ev['date'].replace('Z','+00:00'))
              matched.append({
                  'date':d,'eventTicker':et,'markets':ms,'espn':ev,'comp':comp,
                  'home':home,'away':away,'home_score':hs,'away_score':as_,
                  'start':start,'winner_id':str(home['id']) if hs>as_ else str(away['id']) if as_>hs else None
              })

          print('matched_events=',len(matched))
          if len(matched)<60:
              raise SystemExit('Not enough matched historical games')

          # Fetch team schedules for 2025 and 2024 for all teams in sample.
          ids=sorted({str(x['home']['id']) for x in matched}|{str(x['away']['id']) for x in matched})
          sched={}
          def fetch_sched(args):
              tid,season=args
              u=f'{E}/teams/{tid}/schedule?season={season}'
              j=get(u,30,2)
              # merge regular-season endpoint in case ESPN default omits rows
              try:
                  r=get(u+'&seasontype=2',30,2)
                  ev=(j.get('events') or [])+(r.get('events') or [])
              except:
                  ev=j.get('events') or []
              seen=set();res=[]
              for e in ev:
                  k=e.get('id') or (str(e.get('date'))+str(e.get('name')))
                  if k in seen:continue
                  seen.add(k);res.append(e)
              return tid,season,res

          with ThreadPoolExecutor(max_workers=18) as ex:
              futs=[ex.submit(fetch_sched,(tid,season)) for tid in ids for season in (2024,2025)]
              for f in as_completed(futs):
                  tid,season,ev=f.result();sched[(tid,season)]=ev

          def rows(team_id,season,cutoff):
              out=[]
              for e in sched.get((str(team_id),season),[]):
                  try: dt=datetime.datetime.fromisoformat(e['date'].replace('Z','+00:00'))
                  except: continue
                  if dt>=cutoff:continue
                  comp=(e.get('competitions') or [{}])[0]
                  # strict completion gate = no future/live rows
                  completed=bool((e.get('status') or {}).get('type',{}).get('completed',False) or (comp.get('status') or {}).get('type',{}).get('completed',False))
                  if not completed:
                      continue
                  cs=comp.get('competitors') or []
                  us=next((c for c in cs if str(c.get('id'))==str(team_id)),None)
                  them=next((c for c in cs if str(c.get('id'))!=str(team_id)),None)
                  if not us or not them:continue
                  pf=score_value(us);pa=score_value(them)
                  if pf is None or pa is None:continue
                  out.append({'dt':dt,'pf':pf,'pa':pa,'win':1 if pf>pa else 0 if pf<pa else .5,'venue':us.get('homeAway')})
              out.sort(key=lambda x:x['dt'],reverse=True)
              return out

          def summary(r,limit=None):
              z=r[:limit] if limit else r
              if not z:return {'games':0,'win':.5,'margin':0}
              return {'games':len(z),'win':sum(x['win'] for x in z)/len(z),'margin':sum(x['pf']-x['pa'] for x in z)/len(z)}

          def venue(r,v):
              return summary([x for x in r if x['venue']==v])

          def shrunk_pct(stat,prior=.5,pseudo=6):
              g=stat['games'];return (stat['win']*g+prior*pseudo)/(g+pseudo)

          def team_stats(tid,cutoff,prior_pseudo):
              cur_rows=rows(tid,2025,cutoff);prior_rows=rows(tid,2024,cutoff)
              cur=summary(cur_rows);recent=summary(cur_rows,6);pr=summary(prior_rows)
              ven_home=venue(cur_rows,'home');ven_away=venue(cur_rows,'away')
              prior_pct=shrunk_pct(pr,.5,6)
              current_pct=shrunk_pct(cur,prior_pct,prior_pseudo)
              recent_pct=shrunk_pct(recent,current_pct,4)
              cur_margin=cur['margin']*(cur['games']/(cur['games']+prior_pseudo)) if cur['games'] else 0
              recent_margin=recent['margin']*(recent['games']/(recent['games']+5)) if recent['games'] else 0
              return {'rows':cur_rows,'cur':cur,'recent':recent,'prior':pr,'priorPct':prior_pct,
                      'currentPct':current_pct,'recentPct':recent_pct,'curMargin':cur_margin,
                      'recentMargin':recent_margin,'homePct':shrunk_pct(ven_home,current_pct,4),
                      'awayPct':shrunk_pct(ven_away,current_pct,4)}

          def rank(c):
              try:
                  n=int((c.get('curatedRank') or {}).get('current') or 99)
                  return n if n>0 else 99
              except:return 99

          # Build a no-lookahead opponent-strength Elo timeline from deduplicated
          # 2024-25 completed games found in team schedules.
          all_games={}
          for (tid,season),evs in sched.items():
              for e in evs:
                  try: dt=datetime.datetime.fromisoformat(e['date'].replace('Z','+00:00'))
                  except: continue
                  comp=(e.get('competitions') or [{}])[0]
                  completed=bool((e.get('status') or {}).get('type',{}).get('completed',False) or (comp.get('status') or {}).get('type',{}).get('completed',False))
                  if not completed:continue
                  cs=comp.get('competitors') or []
                  if len(cs)!=2:continue
                  a,b=cs
                  sa=score_value(a);sb=score_value(b)
                  if sa is None or sb is None or sa==sb:continue
                  gid=e.get('id') or f"{dt.isoformat()}-{a.get('id')}-{b.get('id')}"
                  all_games[gid]={
                      'dt':dt,'a':str(a.get('id')),'b':str(b.get('id')),
                      'a_home':a.get('homeAway')=='home','b_home':b.get('homeAway')=='home',
                      'a_win':1 if sa>sb else 0
                  }
          elo_games=sorted(all_games.values(),key=lambda x:x['dt'])
          print('ELO_HISTORY_GAMES',len(elo_games))

          elo_cache={}
          def elo_at(cutoff,k=24,home_pts=45):
              key=(int(cutoff.timestamp())//3600,k,home_pts)
              if key in elo_cache:return elo_cache[key]
              r=defaultdict(lambda:1500.0)
              for g in elo_games:
                  if g['dt']>=cutoff:break
                  ra=r[g['a']];rb=r[g['b']]
                  adj_a=ra+(home_pts if g['a_home'] else 0)
                  adj_b=rb+(home_pts if g['b_home'] else 0)
                  ea=1/(1+10**((adj_b-adj_a)/400))
                  delta=k*(g['a_win']-ea)
                  r[g['a']]=ra+delta;r[g['b']]=rb-delta
              elo_cache[key]=dict(r)
              return elo_cache[key]

          PARAMS=[]
          for prior_pseudo in (4,6,8,10):
            for wcur in (.18,.22,.26,.30):
              for wprior in (.06,.10,.14):
                for wrecent in (.03,.05,.07):
                  for wmargin in (.04,.06,.08):
                    for elo_blend in (.15,.25,.35,.45):
                      PARAMS.append((prior_pseudo,wcur,wprior,wrecent,wmargin,elo_blend))

          # Precompute raw features at strict entry time = 24h before kickoff.
          rows_all=[]
          for x in matched:
              entry=x['start']-datetime.timedelta(hours=24)
              Hbase={};Abase={}
              # Store sufficient summaries for each prior-pseudo candidate lazily below.
              rows_all.append({'x':x,'entry':entry})

          def predict(row,param):
              prior_pseudo,wcur,wprior,wrecent,wmargin,elo_blend=param
              x=row['x'];entry=row['entry']
              H=team_stats(x['home']['id'],entry,prior_pseudo)
              A=team_stats(x['away']['id'],entry,prior_pseudo)
              cg=min(H['cur']['games'],A['cur']['games']);pg=min(H['prior']['games'],A['prior']['games'])
              if cg<1 and pg<4:return None
              p=.5
              p+=wcur*(H['currentPct']-A['currentPct'])
              p+=wprior*(H['priorPct']-A['priorPct'])
              p+=wrecent*(H['recentPct']-A['recentPct'])
              p+=wmargin*max(-1.5,min(1.5,(H['curMargin']-A['curMargin'])/14))
              p+=.025*max(-1.5,min(1.5,(H['recentMargin']-A['recentMargin'])/14))
              p+=.035*(H['homePct']-A['awayPct'])
              p+=.025
              hr=rank(x['home']);ar=rank(x['away'])
              hs=(26-hr)/25 if hr<=25 else 0;as_=(26-ar)/25 if ar<=25 else 0
              p+=.045*(hs-as_)

              ratings=elo_at(entry)
              rh=ratings.get(str(x['home']['id']),1500.0)
              ra=ratings.get(str(x['away']['id']),1500.0)
              elo_home=1/(1+10**(((ra)-(rh+45))/400))
              p=p*(1-elo_blend)+elo_home*elo_blend

              q=max(.25,min(1,(.25+.50*min(1,cg/8)+.25*min(1,pg/12))))
              cap=.82+(.87-.82)*q
              p=max(1-cap,min(cap,p))
              y=1 if x['winner_id']==str(x['home']['id']) else 0
              return p,y,q,H,A

          # Four chronological blocks: model fit -> probability calibration ->
          # entry-rule tuning -> untouched final holdout.
          rows_all.sort(key=lambda r:r['x']['start'])
          nrows=len(rows_all)
          c1=int(nrows*.50);c2=int(nrows*.60);c3=int(nrows*.75)
          model_train=rows_all[:c1]
          calibration=rows_all[c1:c2]
          gate_tune=rows_all[c2:c3]
          hold=rows_all[c3:]

          def prob_metrics(pred):
              if not pred:return (9,0,0,0,0)
              brier=sum((p-y)**2 for p,y,q in pred)/len(pred)
              acc=sum((p>=.5)==bool(y) for p,y,q in pred)/len(pred)
              bins=defaultdict(list)
              for p,y,q in pred: bins[min(9,int(p*10))].append((p,y))
              ece=sum(len(v)/len(pred)*abs(sum(p for p,y in v)/len(v)-sum(y for p,y in v)/len(v)) for v in bins.values())
              hi=[(p,y) for p,y,q in pred if max(p,1-p)>=.70]
              hiacc=sum((p>=.5)==bool(y) for p,y in hi)/len(hi) if hi else 0
              return brier,acc,ece,len(pred),hiacc

          def metrics(dataset,param):
              pred=[]
              for r in dataset:
                  z=predict(r,param)
                  if z:pred.append(z[:3])
              return prob_metrics(pred)

          scored=[]
          for pset in PARAMS:
              m=metrics(model_train,pset)
              obj=m[0]+.45*m[2]-.05*m[1]
              scored.append((obj,pset,m))
          scored.sort(key=lambda x:x[0])
          best=scored[0]
          print('BEST_PARAMS',best[1])
          print('MODEL_TRAIN_METRICS',best[2])

          def sigmoid(x):return 1/(1+math.exp(-x))
          def logit(p):
              p=max(.001,min(.999,p))
              return math.log(p/(1-p))
          calibration_grid=[]
          raw_cal=[]
          for r in calibration:
              z=predict(r,best[1])
              if z:raw_cal.append(z[:3])
          for temp in (.55,.70,.85,1.0,1.15):
              for bias in (-.20,-.10,0,.10,.20):
                  pred=[(sigmoid(bias+temp*logit(p)),y,q) for p,y,q in raw_cal]
                  m=prob_metrics(pred)
                  calibration_grid.append((m[0]+.35*m[2],(temp,bias),m))
          calibration_grid.sort(key=lambda x:x[0])
          best_cal=calibration_grid[0]
          print('BEST_CALIBRATION',best_cal[1])
          print('CALIBRATION_METRICS',best_cal[2])

          def predict_cal(r,param=best[1],cal=best_cal[1]):
              z=predict(r,param)
              if not z:return None
              p,y,q,H,A=z
              temp,bias=cal
              pc=sigmoid(bias+temp*logit(p))
              return pc,y,q,H,A

          hold_pred=[predict_cal(r)[:3] for r in hold if predict_cal(r)]
          hold_metrics=prob_metrics(hold_pred)
          print('HOLDOUT_METRICS',hold_metrics)

          base=(6,.24,.10,.07,.07,0)
          print('BASE_HOLDOUT',metrics(hold,base))

          # Replay the full 24-hour pregame Kalshi price path.
          # The model probability is frozen at each game's analysis cutoff; only market
          # price/liquidity may change. This mirrors the live bot repeatedly scanning.
          def candles_for_market(m,start):
              ticker=m['ticker'];ts=int(start.timestamp())
              kickoff=ts+24*3600
              q=urllib.parse.urlencode({'start_ts':ts-3600,'end_ts':kickoff,'period_interval':60})
              u=K+'/historical/markets/'+urllib.parse.quote(ticker,safe='')+'/candlesticks?'+q
              try:j=get(u,30,2)
              except:return []
              out=[]
              for c in sorted(j.get('candlesticks') or [],key=lambda x:x.get('end_period_ts',0)):
                  ct=c.get('end_period_ts',0)
                  if ct<ts or ct>=kickoff:continue
                  try:
                      ask=float((c.get('yes_ask') or {}).get('close'))
                      bid=float((c.get('yes_bid') or {}).get('close'))
                      vol=float(c.get('volume') or 0)
                  except:continue
                  if 0<ask<1 and 0<=bid<=ask:
                      out.append({'ask':ask,'bid':bid,'vol':vol,'ts':ct})
              return out

          def collect_paths(dataset):
              jobs=[]
              for r in dataset:
                  z=predict_cal(r)
                  if not z:continue
                  x=r['x'];p_home=z[0]
                  for m in x['markets']:
                      team=m.get('yes_sub_title') or ''
                      sh=team_sim(team,x['home']);sa=team_sim(team,x['away'])
                      if max(sh,sa)<.35:continue
                      prob=p_home if sh>=sa else 1-p_home
                      jobs.append((r,m,prob,z[2]))
              out=[]
              with ThreadPoolExecutor(max_workers=18) as ex:
                  fm={ex.submit(candles_for_market,m,r['entry']):(r,m,prob,qual) for r,m,prob,qual in jobs}
                  for fut in as_completed(fm):
                      r,m,prob,qual=fm[fut]
                      path=fut.result()
                      if not path:continue
                      out.append({
                          'prob':prob,'quality':qual,'won':str(m.get('result','')).lower()=='yes',
                          'event':r['x']['eventTicker'],'team':m.get('yes_sub_title'),
                          'start':r['x']['start'].isoformat(),'path':path
                      })
              return out

          gate_paths=collect_paths(gate_tune)
          hold_paths=collect_paths(hold)
          print('GATE_TUNE_PATHS',len(gate_paths),'HOLDOUT_PATHS',len(hold_paths))

          def apply_gate(paths,gate):
              minprob,minedge,maxspread,maxask,favprem=gate
              bets=[]
              for x in paths:
                  if x['prob']<minprob or x['quality']<.45:continue
                  entry=None
                  for qv in x['path']:
                      ask=qv['ask'];bid=qv['bid']
                      fee=.07*ask*(1-ask)
                      edge=x['prob']-ask-fee
                      req=minedge+max(0,ask-.75)*favprem
                      if edge>=req and (ask-bid)<=maxspread and ask<=maxask:
                          entry={**qv,'edge':edge,'req':req}
                          break
                  if entry:
                      bets.append({k:v for k,v in x.items() if k!='path'}|entry)
              return bets

          def bet_metrics(bets):
              if not bets:return {'n':0,'wr':0,'roi':-9,'profit':0,'brier':9}
              wins=sum(x['won'] for x in bets)
              profit=sum((1-x['ask'] if x['won'] else -x['ask']) for x in bets)
              stake=sum(x['ask'] for x in bets)
              roi=profit/stake if stake else -9
              brier=sum((x['prob']-(1 if x['won'] else 0))**2 for x in bets)/len(bets)
              return {'n':len(bets),'wr':wins/len(bets),'roi':roi,'profit':profit,'brier':brier}

          # Profit diagnostics before gate optimization: isolate whether any
          # consistent zone exists by entry timing, probability, edge, and price.
          def first_entry(x,minprob=.56,minedge=.0,maxspread=.12,maxask=.99,hours_min=0,hours_max=24):
              if x['prob']<minprob or x['quality']<.45:return None
              kickoff=datetime.datetime.fromisoformat(x['start'])
              kts=int(kickoff.timestamp())
              for qv in x['path']:
                  hrs=(kts-qv['ts'])/3600
                  if hrs<hours_min or hrs>hours_max:continue
                  ask=qv['ask'];bid=qv['bid']
                  fee=.07*ask*(1-ask)
                  edge=x['prob']-ask-fee
                  if edge>=minedge and (ask-bid)<=maxspread and ask<=maxask:
                      return {**x,**qv,'edge':edge,'hrs':hrs}
              return None

          def diag_metrics(rows):
              if not rows:return {'n':0,'wr':0,'roi':None,'avg_edge':None,'avg_ask':None}
              wins=sum(x['won'] for x in rows)
              stake=sum(x['ask'] for x in rows)
              profit=sum((1-x['ask'] if x['won'] else -x['ask']) for x in rows)
              return {
                  'n':len(rows),
                  'wr':round(wins/len(rows),4),
                  'roi':round(profit/stake,4) if stake else None,
                  'avg_edge':round(sum(x['edge'] for x in rows)/len(rows),4),
                  'avg_ask':round(sum(x['ask'] for x in rows)/len(rows),4)
              }

          print('=== TRAIN PROFIT DIAGNOSTICS ===')
          time_windows=[(12,24),(6,12),(2,6),(.5,2),(0,.5)]
          for lo,hi in time_windows:
              rows=[z for x in tune_paths if (z:=first_entry(x,.56,.00,.12,.95,lo,hi))]
              print('TIME_WINDOW',lo,hi,diag_metrics(rows))
          for p in (.56,.60,.64,.68,.72,.76):
              rows=[z for x in tune_paths if (z:=first_entry(x,p,.00,.12,.95,0,24))]
              print('MINPROB',p,diag_metrics(rows))
          for edge in (0,.02,.04,.06,.08,.10,.12,.15,.20):
              rows=[z for x in tune_paths if (z:=first_entry(x,.56,edge,.12,.95,0,24))]
              print('MINEDGE',edge,diag_metrics(rows))
          for maxask in (.45,.55,.65,.75,.85,.95):
              rows=[z for x in tune_paths if (z:=first_entry(x,.56,.00,.12,maxask,0,24))]
              print('MAXASK',maxask,diag_metrics(rows))

          gates=[]
          for minprob in (.56,.58,.60,.62,.64,.66):
            for minedge in (.02,.03,.04,.05,.06,.08,.10):
              for maxspread in (.04,.06,.08,.10,.12):
                for maxask in (.68,.72,.76,.80,.84,.90):
                  for favprem in (.10,.20,.30):
                      g=(minprob,minedge,maxspread,maxask,favprem)
                      bm=bet_metrics(apply_gate(gate_paths,g))
                      if bm['n']<8:continue
                      # The gate must work on training data before holdout is revealed.
                      if bm['roi']<=0 or bm['brier']>=.25:continue
                      # Reward ROI/calibration while preferring rules supported by more bets.
                      score=bm['roi'] + .08*bm['wr'] - .10*bm['brier'] + min(bm['n'],40)*.002
                      gates.append((score,g,bm))
          gates.sort(key=lambda x:x[0],reverse=True)
          if not gates:
              raise SystemExit('No profitable/calibrated entry gate on training price paths')
          best_gate=gates[0]
          print('BEST_ENTRY_GATE',best_gate[1])
          print('GATE_TUNE_BET_METRICS',best_gate[2])

          hold_bets=apply_gate(hold_paths,best_gate[1])
          hbm=bet_metrics(hold_bets)
          print('HOLDOUT_BET_METRICS',hbm)
          for x in hold_bets[:50]:print('HOLDOUT_BET',json.dumps(x,sort_keys=True))
          hb,ha,he,hn,hhi=hold_metrics
          bb,ba,be,bn,bhi=metrics(hold,base)
          model_pass = hb < .245 and he < .12 and hb <= bb+.01
          # Trading pass requires more than a one-off result; at least 3 holdout bets,
          # non-negative holdout ROI, and probabilities that remain reasonably calibrated.
          trading_pass = hbm['n']>=5 and hbm['roi']>0 and hbm['brier']<.25
          passed = model_pass and trading_pass
          print('MODEL_PASS',model_pass)
          print('TRADING_PASS',trading_pass)
          print('BACKTEST_PASS',passed)
          if not passed:
              raise SystemExit('Holdout trading criteria not met')

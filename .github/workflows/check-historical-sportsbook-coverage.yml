name: Check historical sportsbook coverage

on:
  push:
    paths:
      - ".github/workflows/check-historical-sportsbook-coverage.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count NCAAF historical moneylines
        run: |
          python - <<'PY'
          import json,urllib.request,datetime
          H={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          dates=['20250906','20250913','20250920','20250927','20251004','20251011','20251018','20251025','20251101','20251108','20251115','20251122','20251129']
          total=withodds=withml=0
          examples=[]
          for d in dates:
            u='https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates='+d+'&limit=500'
            with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r:j=json.load(r)
            for e in j.get('events',[]):
              total+=1
              c=(e.get('competitions') or [{}])[0]
              odds=c.get('odds')
              if odds:
                withodds+=1
                o=odds[0]
                ml=o.get('moneyline') or o.get('moneyLine')
                if ml:
                  withml+=1
                  if len(examples)<8: examples.append((e.get('name'),ml))
          print('TOTAL',total,'WITH_ODDS',withodds,'WITH_MONEYLINE',withml)
          for e,ml in examples:
            print('EXAMPLE',e,json.dumps(ml)[:1200])
          PY
